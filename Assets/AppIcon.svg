<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Album-art chip: warm pink → amber accent -->
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7E9D"/>
      <stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>
    <!-- Glossy highlight on the top of the island -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft drop shadow for the island -->
    <filter id="islandShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- The Dynamic Island pill (no background tile — transparent) -->
  <g filter="url(#islandShadow)">
    <rect x="212" y="424" width="600" height="176" rx="88" ry="88" fill="#000000"/>
  </g>
  <!-- thin light rim + top gloss -->
  <rect x="212" y="424" width="600" height="176" rx="88" ry="88"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="236" y="430" width="552" height="90" rx="78" ry="60" fill="url(#gloss)"/>

  <!-- Album art peeking on the LEFT -->
  <rect x="256" y="454" width="116" height="116" rx="26" ry="26" fill="url(#art)"/>
  <!-- little music note on the art -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="336" y="474" width="10" height="56" rx="5"/>
    <circle cx="322" cy="532" r="15"/>
  </g>

  <!-- Equalizer bars on the RIGHT -->
  <g fill="#ffffff">
    <rect x="596" y="476" width="24" height="72"  rx="12"/>
    <rect x="642" y="448" width="24" height="128" rx="12"/>
    <rect x="688" y="464" width="24" height="96"  rx="12"/>
    <rect x="734" y="437" width="24" height="150" rx="12"/>
  </g>
</svg>
